        <a href="/" class="site-header__brand" id="siteHeaderHome" aria-label="MealNova home">
          <span class="brand-mark" aria-hidden="true"></span>

          <button type="button" class="btn btn-primary btn-sm" id="siteHeaderTryFree">Start free</button>
        </div>
      </div>

            <span class="brand-mark" aria-hidden="true"></span>

          <p class="tagline" id="headerDate"></p>
        </div>
        <button type="button" class="header-auth-btn" id="headerAuthBtn" hidden>Sign in</button>
      </div>
    </header>
    <main id="main" class="main"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <div class="sidebar-brand" aria-hidden="true">

        <div class="sidebar-brand__text">

        </div>
      </div>

          <span class="nav-btn__log-label">Log meal</span>
          <span class="nav-btn__log-label-short">Log</span>
        </button>
        <button type="button" class="nav-btn active" data-view="today" aria-current="page">

        </button>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 5-6"/></svg>

          <span>Reports</span>
        </button>

          <span class="nav-icon" aria-hidden="true">
